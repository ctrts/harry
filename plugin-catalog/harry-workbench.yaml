description: The Harry desktop app in your browser. `harry workbench` serves the desktop interface through the Harry dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `harry workbench` run and again after each Harry update it runs `npm install --ignore-scripts` (guided by Harry's lockfile) and Vite against your Harry checkout's desktop sources, writing only under ~/.harry/harry-workbench and its own plugin dir (the checkout is only read), and starts `harry dashboard` on loopback when none is running.
